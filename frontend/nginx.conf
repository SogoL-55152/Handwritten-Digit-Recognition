# Keep request diagnostics without query strings, headers or request bodies.
log_format hdr_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Match Java's 5 MiB image / 6 MiB multipart request contract.
    client_max_body_size 6m;
    access_log /dev/stdout hdr_privacy;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

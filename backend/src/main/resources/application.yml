server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hdr-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hdr_w2?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:hdr}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

hdr:
  pilot:
    enabled: ${HDR_PILOT_ENABLED:false}
    registration-code: ${PILOT_REGISTRATION_CODE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  legacy:
    auth-enabled: ${HDR_LEGACY_AUTH_ENABLED:false}
    bootstrap-enabled: ${HDR_LEGACY_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${HDR_LEGACY_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${HDR_LEGACY_BOOTSTRAP_PASSWORD:}
  v2:
    jwt:
      secret: ${V2_JWT_SECRET:}
      expire-hours: ${V2_JWT_EXPIRE_HOURS:24}
    limits:
      max-workspaces: ${W2_MAX_WORKSPACES:3}
      recognition-per-minute: ${W2_RECOGNITION_PER_MINUTE:60}
      max-members: ${W2_MAX_MEMBERS:5}
      daily-recognition-limit: ${W2_DAILY_RECOGNITION_LIMIT:1000}
  jwt:
    secret: ${JWT_SECRET:hdr-dev-secret-key-please-change-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  model-service:
    base-url: ${MODEL_SERVICE_URL:http://127.0.0.1:5001}
    internal-token: ${MODEL_INTERNAL_TOKEN:}

logging:
  level:
    com.hdr: info

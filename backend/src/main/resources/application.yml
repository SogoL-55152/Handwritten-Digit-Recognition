server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: hdr-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hdr_w2?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:hdr}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      resolve-lazily: true
      # zip 导入需要更大的上限；单张图片的 5MB 限制由 ImageValidator 单独把关
      max-file-size: 500MB
      max-request-size: 520MB
      # 1MB 以内不落盘：小图上传不再依赖临时目录（安全软件占用临时文件曾导致解析失败）
      file-size-threshold: 1MB
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

hdr:
  pilot:
    enabled: ${HDR_PILOT_ENABLED:false}
    registration-code: ${PILOT_REGISTRATION_CODE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  import:
    # 按钮触发 SVHN 导入：后端拉起脚本；目录必须位于 root 之下
    python: ${HDR_IMPORT_PYTHON:D:/Temp/hdr-w4-venv/Scripts/python.exe}
    script: ${HDR_IMPORT_SCRIPT:model-service/tools/svhn_import.py}
    root: ${HDR_IMPORT_ROOT:.}
    timeout-seconds: ${HDR_IMPORT_TIMEOUT_SECONDS:900}
  legacy:
    auth-enabled: ${HDR_LEGACY_AUTH_ENABLED:false}
    bootstrap-enabled: ${HDR_LEGACY_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${HDR_LEGACY_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${HDR_LEGACY_BOOTSTRAP_PASSWORD:}
  v2:
    # 空库部署时用这两个变量补一个 SUPER_ADMIN（见部署手册 1.6）；留空则不做任何事
    bootstrap-admin:
      username: ${HDR_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${HDR_BOOTSTRAP_ADMIN_PASSWORD:}
    jwt:
      secret: ${V2_JWT_SECRET:}
      expire-hours: ${V2_JWT_EXPIRE_HOURS:24}
    limits:
      max-workspaces: ${W2_MAX_WORKSPACES:3}
      recognition-per-minute: ${W2_RECOGNITION_PER_MINUTE:60}
      # 全平台识别上限，历史上写死在 RecognitionService；压测/扩容时在这里调
      global-recognition-per-minute: ${W2_GLOBAL_RECOGNITION_PER_MINUTE:240}
      max-members: ${W2_MAX_MEMBERS:5}
      daily-recognition-limit: ${W2_DAILY_RECOGNITION_LIMIT:1000}
      # 注册接口按 IP 的配额（默认 5 次/15 分钟）。只在压测/联调环境放大，生产保持默认。
      register-per-ip: ${W2_REGISTER_PER_IP:5}
      register-window-seconds: ${W2_REGISTER_WINDOW_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET:hdr-dev-secret-key-please-change-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  model-service:
    base-url: ${MODEL_SERVICE_URL:http://127.0.0.1:5001}
    internal-token: ${MODEL_INTERNAL_TOKEN:}

logging:
  level:
    com.hdr: info

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hdr-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hdr?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

hdr:
  jwt:
    secret: ${JWT_SECRET:hdr-dev-secret-key-please-change-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  model-service:
    base-url: ${MODEL_SERVICE_URL:http://localhost:5001}

logging:
  level:
    com.hdr: info

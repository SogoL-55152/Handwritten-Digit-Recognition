services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique MySQL root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hdr_w2}
      MYSQL_USER: hdr
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      TZ: UTC
    volumes:
      # A new W2 volume; never reuse or automatically baseline the W1 volume.
      - mysql-w2-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 训练队列。没有 worker 时训练任务会一直停在 QUEUED，所以默认就起。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-service:
    build: ./model-service
    environment:
      HOST: 0.0.0.0
      PORT: "5001"
      MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:?Set the internal model credential}
      WEIGHTS_DIR: /weights
      MODEL_REGISTRY_PATH: /weights/registry.json
      RECOGNITION_MIN_CONFIDENCE: ${RECOGNITION_MIN_CONFIDENCE:-0.90}
      RECOGNITION_MIN_MARGIN: ${RECOGNITION_MIN_MARGIN:-0.85}
    volumes:
      - type: bind
        source: ${MODEL_WEIGHTS_DIR:?Set an absolute path to the directory holding registry.json and verified checkpoints}
        target: /weights
        read_only: true
        bind:
          create_host_path: false

  backend:
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hdr_w2}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: hdr
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      MODEL_SERVICE_URL: http://model-service:5001
      MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:?Set the internal model credential}
      V2_JWT_SECRET: ${V2_JWT_SECRET:?Set a unique v2 signing key of at least 32 bytes}
      HDR_LEGACY_AUTH_ENABLED: "false"
      HDR_LEGACY_BOOTSTRAP_ENABLED: "false"
      W2_MAX_WORKSPACES: ${W2_MAX_WORKSPACES:-3}
      W2_RECOGNITION_PER_MINUTE: ${W2_RECOGNITION_PER_MINUTE:-60}
      W2_GLOBAL_RECOGNITION_PER_MINUTE: ${W2_GLOBAL_RECOGNITION_PER_MINUTE:-240}
      W2_MAX_MEMBERS: ${W2_MAX_MEMBERS:-5}
      W2_DAILY_RECOGNITION_LIMIT: ${W2_DAILY_RECOGNITION_LIMIT:-1000}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      # 训练导出目录；与 worker 共用同一个数据卷，路径必须完全一致
      HDR_TRAINING_DATA_DIR: /training-data
    volumes:
      - training-data:/training-data
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_started
      redis:
        condition: service_healthy

  # 训练 worker：一个容器同时只跑一个任务（--pool=solo）；要并发就扩副本。
  worker:
    build:
      context: ./model-service
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:?Set the internal model credential}
      TRAINING_CALLBACK_URL: http://backend:8080
      WEIGHTS_DIR: /weights
      MODEL_REGISTRY_PATH: /weights/registry.json
      # MNIST 原始 IDX 需要事先放进这个卷的 MNIST/raw 子目录（见部署手册 1.5）
      TRAINING_DATA_DIR: /training-data/MNIST/raw
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      # worker 要写 checkpoint 与新模型版本，所以不能只读
      - type: bind
        source: ${MODEL_WEIGHTS_DIR:?Set an absolute path to the directory holding registry.json and verified checkpoints}
        target: /weights
        bind:
          create_host_path: false
      - training-data:/training-data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  mysql-w2-data:
  redis-data:
  training-data:

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique MySQL root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hdr_w2}
      MYSQL_USER: hdr
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      TZ: UTC
    volumes:
      # A new W2 volume; never reuse or automatically baseline the W1 volume.
      - mysql-w2-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Reserved for later training/queue work; not required or reported UP in W2.
  redis:
    image: redis:7-alpine
    profiles: [future-training]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  model-service:
    build: ./model-service
    environment:
      HOST: 0.0.0.0
      PORT: "5001"
      MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:?Set the internal model credential}
      MODEL_CHECKPOINT_PATH: /weights/checkpoint.pt
    volumes:
      - type: bind
        source: ${MODEL_CHECKPOINT_PATH:?Set an absolute path to the verified W1 full checkpoint}
        target: /weights/checkpoint.pt
        read_only: true
        bind:
          create_host_path: false

  backend:
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hdr_w2}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: hdr
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      MODEL_SERVICE_URL: http://model-service:5001
      MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:?Set the internal model credential}
      V2_JWT_SECRET: ${V2_JWT_SECRET:?Set a unique v2 signing key of at least 32 bytes}
      HDR_LEGACY_AUTH_ENABLED: "false"
      HDR_LEGACY_BOOTSTRAP_ENABLED: "false"
      W2_MAX_WORKSPACES: ${W2_MAX_WORKSPACES:-3}
      W2_RECOGNITION_PER_MINUTE: ${W2_RECOGNITION_PER_MINUTE:-60}
      W2_MAX_MEMBERS: ${W2_MAX_MEMBERS:-5}
      W2_DAILY_RECOGNITION_LIMIT: ${W2_DAILY_RECOGNITION_LIMIT:-1000}
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  mysql-w2-data:
  redis-data:
